<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page 3 - Nirdeshak AI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('{{ url_for('static', filename='images/background2.gif') }}') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    .settings-button {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s;
    }

    .settings-button:hover {
      background-color: #218838;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-gap: 20px;
      margin-top: 80px;
      width: 90%;
      max-width: 800px;
    }

    .box {
      background-color: #ffffff;
      padding: 30px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #333;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .box:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .nirdeshak-box {
      background-color: #ffffff;
      margin-top: 40px;
      padding: 30px;
      width: 90%;
      max-width: 800px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .action-button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      background-color: #007bff;
      transition: background-color 0.3s;
    }

    .action-button:hover {
      background-color: #0056b3;
    }

    .form-container {
      display: none;
      background-color: #fff;
      padding: 30px;
      margin-top: 80px;
      width: 90%;
      max-width: 800px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .back-btn {
      margin-top: 20px;
      display: inline-block;
      text-decoration: none;
      background: #dc3545;
      color: white;
      padding: 8px 16px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <button class="settings-button" onclick="openSettings()">Settings</button>

  <div class="grid-container" id="grid">
    <div class="box" onclick="showForm('careerForm')">Career Agent</div>
    <div class="box" onclick="showForm('cookingForm')">Cooking Agent</div>
   <!-- <div class="box" onclick="showForm('emailForm')">Email Agent</div>-->
    <div class="box" onclick="showForm('moodForm')">Mood Enhancement Agent</div>
  </div>

  <div class="nirdeshak-box">
    NIRDESHAK
    <div class="button-group">
      <button class="action-button" onclick="ask()">Ask</button>
      <button class="action-button" onclick="speak()">Speak</button>
    </div>
  </div>

  <!-- Career Recommendation Form -->
  <div id="careerForm" class="form-container">
    <h2>Get Career Suggestions</h2>
    <form method="POST">
      <label for="profile">Enter your interests/skills:</label><br>
      <input type="text" id="profile" name="profile" required>
      <button type="button" onclick="startListeningCareer()">🎤 Speak</button><br><br>
      <button type="submit">Get Suggestions</button>
    </form>
    <a href="#" class="back-btn" onclick="backToGrid()">🔙 Back</a>
  </div>

  <!-- Cooking Agent Form -->
  <div id="cookingForm" class="form-container">
    <h2>Smart Recipe Suggester</h2>
    <form method="POST">
      <label for="ingredient">What ingredient do you have?</label><br>
      <input type="text" id="ingredient" name="ingredient" required>
      <button type="button" onclick="startListeningCooking()">🎤 Speak</button><br><br>
      <button type="submit">Get Recipe</button>
    </form>
    <a href="#" class="back-btn" onclick="backToGrid()">🔙 Back</a>
  </div>

  <!-- Email Classifier Form 
  <div id="emailForm" class="form-container">
    <h2>Classify Your Emails</h2>
    <form method="POST">
      <label>Email:</label><br>
      <input type="email" name="email" required><br><br>
      <label>Password:</label><br>
      <input type="password" name="password" required><br><br>
      <button type="submit">Fetch & Classify</button>
    </form>
    <a href="#" class="back-btn" onclick="backToGrid()">🔙 Back</a>
  </div> -->

  <!-- Mood Booster Form -->
  <div id="moodForm" class="form-container">
    <h2>How are you feeling today?</h2>
    <form method="POST">
      <label for="mood">Describe your mood:</label><br>
      <input type="text" id="mood" name="mood" required>
      <button type="button" onclick="startListeningMood()">🎤 Speak</button><br><br>
      <button type="submit">Get Encouragement</button>
    </form>
    <a href="#" class="back-btn" onclick="backToGrid()">🔙 Back</a>
  </div>

  <script>
    function ask() {
      alert("Ask feature clicked!");
    }

    function speak() {
      alert("Speak feature clicked!");
    }

    function openSettings() {
      alert("Settings clicked!");
    }

    function showForm(formId) {
      document.getElementById('grid').style.display = 'none';
      document.querySelectorAll('.form-container').forEach(div => div.style.display = 'none');
      document.getElementById(formId).style.display = 'block';
    }

    function backToGrid() {
      document.querySelectorAll('.form-container').forEach(div => div.style.display = 'none');
      document.getElementById('grid').style.display = 'grid';
    }

    function startListeningCareer() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.start();
      recognition.onresult = function(event) {
        document.getElementById('profile').value = event.results[0][0].transcript;
      };
    }

    function startListeningCooking() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.start();
      recognition.onresult = function(event) {
        document.getElementById('ingredient').value = event.results[0][0].transcript;
      };
    }

    function startListeningMood() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.start();
      recognition.onresult = function(event) {
        document.getElementById('mood').value = event.results[0][0].transcript;
      };
    }
  </script>

</body>
</html>
